name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Stop here and follow [SECURITY.md](https://github.com/NodeOps-app/createos-sandbox/blob/main/SECURITY.md) instead.
        Everything in this form is public. Don't paste API keys, tokens, or private IPs.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands, API calls, or SDK code that trigger the bug.
      placeholder: |
        1. POST /v1/sandboxes {"shape":"s-1vcpu-1gb"}
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release you run, or "hosted createos.sh".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: text
