      responses:
        '200': { description: Cursor moved, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/computer/mouse/click:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
