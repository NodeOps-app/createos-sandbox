  /v1/sandboxes/{id}/computer/cursor:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: query, required: false, schema: { type: string, pattern: '^screen-[0-7]$', default: screen-0 } }
    get:
      operationId: getSandboxCursor
      summary: Get cursor coordinates
      responses:
        '200':
          description: Cursor coordinates
