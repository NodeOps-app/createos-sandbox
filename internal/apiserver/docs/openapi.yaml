  /v1/sandboxes/{id}/computer/screens:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSandboxComputerScreens
      summary: List configured desktop screens
      responses:
        '200':
          description: Configured screens; VNC bearer tokens are never returned here
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ComputerScreen' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSandboxComputerScreen
      summary: Create an additional desktop screen
      description: Creates the lowest available screen id. A sandbox supports at most eight screens including screen-0.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComputerCreateScreenRequest' } } } }
      responses:
        '200':
          description: Screen created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ComputerScreen' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Screen limit reached or desktop session unavailable }

  /v1/sandboxes/{id}/computer/screens/{screen_id}/connect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: path, required: true, schema: { type: string, pattern: '^screen-[0-7]$' } }
    get:
      operationId: connectSandboxComputerScreen
      summary: Create a live noVNC connection URL
      description: Rotates the screen bearer token. Previously issued URLs cannot establish new websocket sessions, and the new token expires after one hour.
      responses:
        '200':
          description: Fresh noVNC connection details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ComputerScreenConnection' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Sandbox ingress is disabled or desktop session is unavailable }

  /v1/sandboxes/{id}/computer/screens/{screen_id}/resize:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: path, required: true, schema: { type: string, pattern: '^screen-[0-7]$' } }
    post:
      operationId: resizeSandboxComputerScreen
      summary: Resize an existing desktop screen
      description: Restarts the selected display at the new resolution, disconnecting existing noVNC sessions and invalidating previously issued connection tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ComputerCreateScreenRequest'
                - type: object
                  required: [width, height]
      responses:
        '200':
          description: Resized screen
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ComputerScreen' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/computer/screens/{screen_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: path, required: true, schema: { type: string, pattern: '^screen-[0-7]$' } }
    get:
      operationId: getSandboxComputerScreen
      summary: Get one configured desktop screen
      responses:
        '200':
          description: Screen details without its VNC bearer token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ComputerScreen' } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSandboxComputerScreen
      summary: Delete an additional desktop screen
      description: "`screen-0` is the primary screen and cannot be deleted."
      responses:
        '200': { description: Screen deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Primary screen cannot be deleted or desktop session is unavailable }

  # ── managed processes / PTYs ────────────────────────────────────
  /v1/sandboxes/{id}/processes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createSandboxProcess
      summary: Create a managed pipe or PTY process
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessCreateRequest' }
      responses:
        '200':
          description: Process created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProcessDetails' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Sandbox is not running }
        '429': { description: Managed-process limit reached }
    get:
      operationId: listSandboxProcesses
      summary: List managed processes and PTYs
      responses:
        '200':
          description: Process list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProcessListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/processes/{process_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: process_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSandboxProcess
      summary: Inspect a managed process or PTY
      responses:
        '200':
          description: Process details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProcessDetails' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: terminateSandboxProcess
      summary: Terminate the complete managed process tree
      parameters:
        - name: grace_ms
          in: query
          schema: { type: integer, minimum: 0, maximum: 60000, default: 1000 }
      responses:
        '200':
          description: Final process details after the complete tree exits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProcessDetails' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/processes/{process_id}/connect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: process_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: connectSandboxProcess
      summary: Replay and follow ordered process output
      parameters:
        - name: after
          in: query
          description: Resume after this output sequence number.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: NDJSON output stream; remains open until the process exits or the client disconnects.
          content: { application/x-ndjson: { schema: { $ref: '#/components/schemas/ProcessOutputEvent' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Requested output offset has expired from the bounded replay journal }

  /v1/sandboxes/{id}/processes/{process_id}/input:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: process_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: writeSandboxProcessInput
      summary: Write ordered bytes to process stdin or the PTY
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProcessInputRequest' } } }
      responses:
        '200':
          description: Input accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProcessInputResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Process exited or stdin is closed }

  /v1/sandboxes/{id}/processes/{process_id}/stdin/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: process_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: closeSandboxProcessStdin
      summary: Close a pipe process stdin
      responses:
        '200':
          description: Stdin closed
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Wrong process kind, process exited, or stdin already closed }

  /v1/sandboxes/{id}/processes/{process_id}/resize:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: process_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resizeSandboxProcessPTY
      summary: Resize a managed PTY
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProcessResizeRequest' } } }
      responses:
        '200':
          description: PTY resized
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Process is not PTY-backed or has exited }

  /v1/sandboxes/{id}/processes/{process_id}/signal:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: process_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: signalSandboxProcess
      summary: Signal the process group or PTY foreground group
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProcessSignalRequest' } } }
      responses:
        '200':
          description: Signal delivered
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Process has exited }

  /v1/sandboxes/{id}/processes/{process_id}/wait:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: process_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: waitForSandboxProcess
      summary: Wait for the leader or complete process tree to exit
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [leader, tree], default: leader }
        - name: timeout_ms
          in: query
          description: Maximum long-poll duration. Zero or omitted uses 30000 ms.
          schema: { type: integer, format: int64, minimum: 0, maximum: 30000, default: 30000 }
      responses:
        '200':
          description: Final process details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProcessDetails' }
        '404': { $ref: '#/components/responses/NotFound' }
        '408': { description: Wait timeout expired }

  /v1/sandboxes/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: path
        in: query
        required: true
        description: Absolute path inside the VM. `..` rejected.
        schema: { type: string }
    put:
      operationId: uploadFile
      summary: Upload a file into the sandbox
      description: |
        Body is streamed directly into the sandbox without being buffered by
        the control plane. Maximum 10 GiB. Parent directories are auto-created.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: downloadFile
      summary: Download a file from the sandbox
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── egress ──────────────────────────────────────────────────────
  /v1/egress/presets:
    get:
      operationId: listEgressPresets
      summary: List named egress-rule presets
      description: |
        Returns the preset tokens accepted in sandbox create and live egress
        update requests. Presets are expanded by control before persistence
        and enforcement; sandbox responses therefore contain concrete rules.
      responses:
        '200':
          description: Preset catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EgressPresetsView' }

  /v1/sandboxes/{id}/egress:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEgress
      summary: Read the current egress allowlist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EgressView' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setEgress
      summary: Replace the egress allowlist (live, no restart)
      description: |
        Replaces the sandbox's allowlist atomically. Domain-based rule
        changes take effect within ~30 s; IP/port rules apply instantly.
        Named tokens such as `@pypi` and `@npm` are expanded by control;
        the response contains the concrete rules that were stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetEgressReq' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EgressView' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── bandwidth ───────────────────────────────────────────────────
  /v1/sandboxes/{id}/bandwidth:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBandwidth
      summary: Read the sandbox's bandwidth quota / usage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BandwidthView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/bandwidth/recharge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: rechargeBandwidth
      summary: Top up the sandbox's bandwidth quota
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RechargeReq' }
      responses:
        '200':
          description: Recharged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BandwidthView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── metrics ─────────────────────────────────────────────────────
  /v1/sandboxes/{id}/metrics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSandboxMetrics
      summary: Per-sandbox CPU + memory usage snapshot
      description: |
        Reads the owning host's cgroup files on demand and returns
        live memory + CPU figures for one sandbox. Owner-gated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SandboxMetricsView' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── templates (user-defined rootfses) ────────────────────────────
  /v1/templates:
    get:
      operationId: listTemplates
      summary: List the caller's templates (most-recent first)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/TemplateView' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      operationId: submitTemplate
      summary: Submit a Dockerfile to build a custom sandbox image
      description: |
        Returns immediately with a `pending` template; build runs
        asynchronously and the row flips to `ready` (or `failed`) when
        done. Poll `GET /v1/templates/{id}` or tail `…/logs` to follow.
        Per-user concurrent build cap defaults to 2 (429 if exceeded).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreateReq' }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TemplateView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/BadRequest' }

  /v1/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "tpl_<ulid> or friendly name" }
    get:
      operationId: getTemplate
      summary: Get template details (resolves friendly name to latest ready)
      parameters:
        - name: include
          in: query
          required: false
          schema: { type: string, enum: [dockerfile] }
          description: "set to `dockerfile` to include the source in the response"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TemplateView' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTemplate
      summary: Delete a template
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DestroyedResp' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates/{id}/logs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTemplateLogs
      summary: Fetch or stream build logs for a template
      description: |
        Default (`follow=false`, or omitted) returns the full log so far
        as `text/plain`, one raw line per row. Set `?follow=true` to
        stream `application/x-ndjson`; each newline-delimited line is a
        `TemplateLogLine` JSON object. The stream stays open, tailing new
        rows every 500 ms, until the template reaches a terminal status
        or the client disconnects. Empty for pending templates, partial
        while building.
      parameters:
        - name: follow
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: "when true, response is application/x-ndjson stream of TemplateLogLine objects"
        - name: attempt
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: "filter to a specific build attempt; default = all attempts oldest-first"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: "cap the number of lines returned (non-follow only)"
      responses:
        '200':
          description: |
            Content-type depends on ?follow. Non-follow returns the raw
            text log; follow returns an NDJSON stream where every line
            is a TemplateLogLine.
          content:
            text/plain:
              schema:
                type: string
                description: "raw log lines separated by \\n; non-follow default"
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/TemplateLogLine'
              example: |
                {"ts":"2026-07-02T11:37:41.963700123Z","level":"info","line":"Step 1/5: FROM nodeops/sandbox:debian","attempt":1}
                {"ts":"2026-07-02T11:37:42.114512345Z","level":"info","line":"Downloading base image ...","attempt":1}
        '404': { $ref: '#/components/responses/NotFound' }

  # ── networks ────────────────────────────────────────────────────
  /v1/networks:
    get:
      operationId: listNetworks
      summary: List the caller's networks
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/Network' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createNetwork
      summary: Create a network
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkCreateReq' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Network' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/networks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Network name or net-<ulid>" }
    get:
      operationId: getNetwork
      summary: Get one network's details (includes members)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Network' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteNetwork
      summary: Delete a network (must have no members)
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OKResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Network still has active members; detach all sandboxes first }

  /v1/sandboxes/{id}/networks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Sandbox id" }
    post:
      operationId: attachNetwork
      summary: Attach a sandbox to a network
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkEntry' }
      responses:
        '200':
          description: Attached
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OKResp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/networks/{net}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Sandbox id" }
      - { name: net, in: path, required: true, schema: { type: string }, description: "Network name or net-<ulid>" }
    delete:
      operationId: detachNetwork
      summary: Detach a sandbox from a network
      responses:
        '200':
          description: Detached
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OKResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── disks ──────────────────────────────────────────────────────────
  /v1/disks:
    get:
      operationId: listDisks
      summary: List the caller's S3 disks
      description: |
        Credentials are never returned — only the disk metadata + config.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/DiskView' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: |
            Disks API not configured — control was started without a
            `--disk-credential-key`.
    post:
      operationId: createDisk
      summary: Register an S3 bucket as a disk
      description: |
        Server validates the request, runs a 3-second HEAD probe against
        `<endpoint>/<bucket>` to catch typos, then AES-256-GCM encrypts
        the credentials and inserts a `disks` row. Credentials are
        NEVER returned in any response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiskCreateReq' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiskView' }
        '400':
          description: |
            Validation rejection. Common causes: malformed name,
            unsupported `kind`, missing bucket / endpoint / credentials,
            unreachable endpoint (HEAD probe failed), or bucket missing
            (404 from the probe).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A disk with this name already exists.
        '503':
          description: Disks API not configured.

  /v1/disks/{idOrName}:
    parameters:
      - { name: idOrName, in: path, required: true, schema: { type: string }, description: "disk_<ulid> id or user-scoped name" }
    get:
      operationId: getDisk
      summary: Get a disk by id or name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Disk not found, or owned by another user (identical body —
            no existence leak across tenants).
        '503':
          description: Disks API not configured.
    delete:
      operationId: deleteDisk
      summary: Soft-delete a disk
      description: |
        Refuses with 409 if the disk is attached to a non-destroyed
        sandbox. Soft-delete only; the bucket contents are never touched.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiskDeletedResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Disk is attached to a running, paused, creating, resuming,
            or other non-terminal sandbox. Destroy the sandboxes (or
            detach the disk live) before deleting.
        '503':
          description: Disks API not configured.

  /v1/sandboxes/{id}/disks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Sandbox id" }
    get:
      operationId: listSandboxDisks
      summary: List a sandbox's attached disks
      description: |
        Per-attachment view including the live `mount_status` reported
        by the guest agent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/SandboxDiskView' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: attachDiskLive
      summary: Live-attach a disk to a running sandbox
      description: |
        Adds the disk to the sandbox's MMDS-fed desired set; the agent's
        reconciler mounts it on its next tick (~2 ms detection,
        ~1 second to spin up `s3fs`). Live attach only works on
        sandboxes whose `status` is `running` — other states return 409
        with a hint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiskAttachment' }
      responses:
        '200':
          description: Attach accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OKResp' }
        '400':
          description: |
            Validation rejection — empty disk_id, mount_path missing /
            not absolute / contains `..`, or targets a reserved
            filesystem path.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Either the sandbox or the disk isn't owned by the caller
            (identical body — no existence leak).
        '409':
          description: |
            Either (a) the sandbox is not in `running` state — live
            attach requires a running VM; paused/creating/destroying
            sandboxes pick up disk changes via the resume / cold-boot
            flow — or (b) another attachment on the same sandbox
            already claims the requested `mount_path` (unique
            constraint on `(sandbox_id, mount_path)`).
        '503':
          description: Disks API not configured.

  /v1/sandboxes/{id}/disks/{disk_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "Sandbox id" }
      - { name: disk_id, in: path, required: true, schema: { type: string }, description: "Disk id (always `disk_<ulid>`, not a name)" }
    delete:
      operationId: detachDiskLive
      summary: Live-detach a disk at a specific mount path (unmount only; bucket untouched)
      description: |
        Removes one attachment (keyed by `(disk_id, mount_path)`) from the
        sandbox's desired set. The agent reconciler unmounts the FUSE
        backing on the next tick. **The bucket contents are never touched**
        — this only drops the in-VM mount. A disk mounted at multiple
        paths in one sandbox can be detached one path at a time.
      parameters:
        - name: mount_path
          in: query
          required: true
          schema: { type: string }
          description: |
            Absolute path of the attachment to detach. Required because
            a disk may be mounted at multiple paths in the same sandbox.
      responses:
        '200':
          description: Detached
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiskDetachedResp' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            The disk isn't attached to this sandbox (or the sandbox /
            disk isn't owned by the caller). Idempotency boundary —
            the first DELETE wins; the second sees nothing to remove.
