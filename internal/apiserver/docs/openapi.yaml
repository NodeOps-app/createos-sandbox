        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/computer/mouse/up:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: query, required: false, schema: { type: string, pattern: '^screen-[0-7]$', default: screen-0 } }
    post:
      operationId: releaseSandboxMouseButton
      summary: Release a mouse button
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComputerButtonRequest' } } } }
      responses:
        '200': { description: Button released, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
