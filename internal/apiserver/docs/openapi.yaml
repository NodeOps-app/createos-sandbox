    post:
      operationId: clickSandboxMouse
      summary: Click a mouse button, optionally at coordinates
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComputerClickRequest' } } } }
      responses:
        '200': { description: Click delivered, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/computer/mouse/scroll:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: query, required: false, schema: { type: string, pattern: '^screen-[0-7]$', default: screen-0 } }
    post:
      operationId: scrollSandboxMouse
      summary: Scroll vertically
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComputerScrollRequest' } } } }
      responses:
        '200': { description: Scroll delivered, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/computer/mouse/drag:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: query, required: false, schema: { type: string, pattern: '^screen-[0-7]$', default: screen-0 } }
    post:
      operationId: dragSandboxMouse
      summary: Drag from one coordinate to another
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComputerDragRequest' } } } }
      responses:
        '200': { description: Drag completed, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sandboxes/{id}/computer/mouse/down:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: screen_id, in: query, required: false, schema: { type: string, pattern: '^screen-[0-7]$', default: screen-0 } }
    post:
      operationId: pressSandboxMouseButton
      summary: Hold a mouse button down
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ComputerButtonRequest' } } } }
      responses:
        '200': { description: Button held, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
