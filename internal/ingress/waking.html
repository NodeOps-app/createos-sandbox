<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2">
<title>waking up sandbox…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#ffffff;
    color:#3a3a3a;
    font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .banner{
    position:fixed; top:20px; left:24px;
    display:flex; align-items:center; gap:9px;
    letter-spacing:.01em;
  }
  .zzz{ font-size:18px; animation:bob 2.4s ease-in-out infinite; }
  .dots b{ animation:blink 1.4s ease-in-out infinite; }
  .dots b:nth-child(2){ animation-delay:.2s }
  .dots b:nth-child(3){ animation-delay:.4s }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
  @keyframes blink{ 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  @media (prefers-reduced-motion:reduce){ .zzz,.dots b{animation:none} .dots b{opacity:1} }
</style>
</head>
<body>
  <div class="banner">
    <span class="zzz" aria-hidden="true">💤</span>
    <span>we are waking up sandbox<span class="dots"><b>.</b><b>.</b><b>.</b></span></span>
  </div>
</body>
</html>
